<svg xmlns="http://www.w3.org/2000/svg" width="800" height="900" viewBox="0 0 800 900" font-family="Inter Variable, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Source for public/images/securing-agents/four-layers.png (laid out for a ~720px post column).
       Product names are examples of each layer. -->
  <style>
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1.1px; fill: #056252; }
    .title { font-size: 21px; font-weight: 600; fill: #17201e; }
    .sandbox { fill: #f7f8f6; stroke: #087f6d; stroke-width: 2; }
    .slabel { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #056252; }
    .ssub { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .node { fill: #ffffff; stroke: #b9c6c1; stroke-width: 1.2; }
    .check { fill: #ddf2ec; stroke: #087f6d; stroke-width: 1.4; }
    .monitor { fill: #eef2ef; stroke: #087f6d; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .n1 { font-size: 16px; font-weight: 600; fill: #17201e; }
    .n2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .n2a { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #056252; }
    .arrow { stroke: #5e6a67; stroke-width: 1.6; fill: none; }
    .obs { stroke: #087f6d; stroke-width: 1.4; fill: none; stroke-dasharray: 3 4; }
    .chip { fill: #087f6d; }
    .ct { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.6px; fill: #ffffff; }
    .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #5e6a67; }
    .note { font-family: 'IBM Plex Mono', monospace; font-size: 13px; fill: #5e6a67; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e6a67"/>
    </marker>
    <marker id="aho" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#087f6d"/>
    </marker>
  </defs>

  <rect width="800" height="900" fill="#ffffff"/>

  <text class="eyebrow" x="48" y="56">WHERE EACH CONTROL SITS</text>
  <text class="title" x="48" y="92">Four checks between an agent and the outside world</text>

  <!-- sandbox -->
  <rect class="sandbox" x="48" y="136" width="372" height="430" rx="14"/>
  <text class="slabel" x="72" y="166">SANDBOX · e.g. OPENSHELL</text>
  <text class="ssub" x="72" y="188">files, processes, network</text>
  <text class="ssub" x="72" y="206">and credentials set by policy</text>

  <!-- agent -->
  <rect class="node" x="104" y="230" width="260" height="56" rx="8"/>
  <text class="n1" x="234" y="254" text-anchor="middle">Agent</text>
  <text class="n2" x="234" y="274" text-anchor="middle">model + loop</text>

  <!-- flow check -->
  <rect class="check" x="104" y="320" width="260" height="110" rx="8"/>
  <rect class="chip" x="118" y="332" width="128" height="22" rx="11"/>
  <text class="ct" x="182" y="347" text-anchor="middle">LAYER 2 · FLOW</text>
  <text class="n1" x="234" y="380" text-anchor="middle">Flow check</text>
  <text class="n2a" x="234" y="400" text-anchor="middle">e.g. OpenAPPA</text>
  <text class="n2" x="234" y="419" text-anchor="middle">may this data go there?</text>

  <!-- tools -->
  <rect class="node" x="104" y="464" width="260" height="56" rx="8"/>
  <text class="n1" x="234" y="488" text-anchor="middle">Tools</text>
  <text class="n2" x="234" y="508" text-anchor="middle">email, database, files</text>

  <!-- egress gate on the sandbox wall -->
  <rect class="check" x="400" y="437" width="240" height="110" rx="8"/>
  <rect class="chip" x="414" y="449" width="136" height="22" rx="11"/>
  <text class="ct" x="482" y="464" text-anchor="middle">LAYER 1 · REACH</text>
  <text class="n1" x="520" y="497" text-anchor="middle">Egress policy</text>
  <text class="n2a" x="520" y="517" text-anchor="middle">e.g. OpenShell</text>
  <text class="n2" x="520" y="536" text-anchor="middle">may it reach this endpoint?</text>

  <!-- how to read it -->
  <text class="n1" x="470" y="246">How to read it</text>
  <text class="n2" x="470" y="274">An action passes the flow check,</text>
  <text class="n2" x="470" y="294">then the egress policy on the</text>
  <text class="n2" x="470" y="314">sandbox wall. The monitor watches</text>
  <text class="n2" x="470" y="334">from outside, and acceptance</text>
  <text class="n2" x="470" y="354">criteria judge the result.</text>

  <!-- outside world -->
  <rect class="node" x="470" y="606" width="282" height="56" rx="8"/>
  <text class="n1" x="611" y="630" text-anchor="middle">Outside world</text>
  <text class="n2" x="611" y="650" text-anchor="middle">APIs, email, the web</text>

  <!-- acceptance criteria -->
  <rect class="check" x="470" y="718" width="282" height="110" rx="8"/>
  <rect class="chip" x="484" y="730" width="144" height="22" rx="11"/>
  <text class="ct" x="556" y="745" text-anchor="middle">LAYER 4 · VERIFY</text>
  <text class="n1" x="611" y="778" text-anchor="middle">Acceptance criteria</text>
  <text class="n2a" x="611" y="798" text-anchor="middle">your spec, not a product</text>
  <text class="n2" x="611" y="817" text-anchor="middle">did the result meet it?</text>

  <!-- path -->
  <path class="arrow" d="M234 286 L234 315" marker-end="url(#ah)"/>
  <path class="arrow" d="M234 430 L234 459" marker-end="url(#ah)"/>
  <path class="arrow" d="M364 492 L395 492" marker-end="url(#ah)"/>
  <path class="arrow" d="M560 547 L560 601" marker-end="url(#ah)"/>
  <path class="arrow" d="M611 662 L611 713" marker-end="url(#ah)"/>
  <text class="lbl" x="621" y="693">result</text>

  <!-- independent monitor -->
  <rect class="monitor" x="48" y="606" width="372" height="222" rx="12"/>
  <rect class="chip" x="62" y="618" width="136" height="22" rx="11"/>
  <text class="ct" x="130" y="633" text-anchor="middle">LAYER 3 · WATCH</text>
  <text class="n1" x="76" y="672">Independent monitor</text>
  <text class="n2a" x="76" y="698">e.g. Sentry, or logs and alerts</text>
  <text class="n2a" x="76" y="718">that the agent's own credentials</text>
  <text class="n2a" x="76" y="738">cannot reach</text>
  <text class="n2" x="76" y="774">sits outside everything it watches</text>

  <path class="obs" d="M160 606 L160 571" marker-end="url(#aho)"/>
  <path class="obs" d="M330 606 L330 571" marker-end="url(#aho)"/>
  <text class="lbl" x="170" y="593">watches</text>

  <text class="note" x="48" y="874">Illustrative. Product names are examples of each layer.</text>
  <text class="note" x="752" y="874" text-anchor="end">blog.scenehere.ca</text>
</svg>
