<svg xmlns="http://www.w3.org/2000/svg" width="800" height="760" viewBox="0 0 800 760" font-family="Inter Variable, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Source for public/images/ai-judge/shadow-mode.png (laid out for a ~720px post column). Simplified. -->
  <style>
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1.1px; fill: #056252; }
    .title { font-size: 21px; font-weight: 600; fill: #17201e; }
    .node { fill: #ffffff; stroke: #b9c6c1; stroke-width: 1.2; }
    .node-soft { fill: #f7f8f6; stroke: #b9c6c1; stroke-width: 1.2; }
    .judge { fill: #ddf2ec; stroke: #087f6d; stroke-width: 1.4; }
    .shadow { fill: #f3f6f4; stroke: #087f6d; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .n1 { font-size: 16px; font-weight: 600; fill: #17201e; }
    .n2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .n2a { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #056252; }
    .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #5e6a67; }
    .slabel { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #056252; }
    .pill { fill: #ffffff; stroke: #087f6d; stroke-width: 1.2; }
    .pt { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; fill: #056252; }
    .chip { fill: #087f6d; }
    .ct { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; font-weight: 600; letter-spacing: 0.4px; fill: #ffffff; }
    .arrow { stroke: #5e6a67; stroke-width: 1.6; fill: none; }
    .arrow-g { stroke: #087f6d; stroke-width: 1.6; fill: none; }
    .blocked { stroke: #b7473a; stroke-width: 1.6; fill: none; stroke-dasharray: 5 5; }
    .bl { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; fill: #9a2316; }
    .xmark { stroke: #b7473a; stroke-width: 2.4; stroke-linecap: round; }
    .xbg { fill: #fdecea; stroke: #efb2a9; stroke-width: 1.2; }
    .foot { font-family: 'IBM Plex Mono', monospace; font-size: 13px; fill: #5e6a67; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e6a67"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#087f6d"/>
    </marker>
  </defs>

  <rect width="800" height="760" fill="#ffffff"/>

  <text class="eyebrow" x="48" y="56">THE JUDGE IN SHADOW MODE</text>
  <text class="title" x="48" y="92">It reviews every unit the generator writes.</text>
  <text class="title" x="48" y="120">Nothing it finds reaches a teacher or learner yet.</text>

  <!-- left: course generation -->
  <text class="slabel" x="48" y="170">COURSE GENERATION</text>

  <rect class="node" x="48" y="186" width="290" height="58" rx="8"/>
  <text class="n1" x="68" y="211">Generate a unit</text>
  <text class="n2" x="68" y="232">lessons, quizzes, visuals</text>

  <rect class="node" x="48" y="284" width="290" height="58" rx="8"/>
  <text class="n1" x="68" y="309">Code checks</text>
  <text class="n2" x="68" y="330">structure, simple arithmetic</text>

  <path class="arrow" d="M150 244 L150 279" marker-end="url(#ah)"/>
  <!-- retry loop -->
  <path class="arrow" d="M338 313 L362 313 L362 215 L343 215" marker-end="url(#ah)"/>
  <text class="lbl" x="372" y="258">retry with</text>
  <text class="lbl" x="372" y="274">feedback</text>

  <rect class="node" x="48" y="382" width="290" height="58" rx="8"/>
  <text class="n1" x="68" y="407">Draft course</text>
  <text class="n2" x="68" y="428">unit by unit</text>
  <path class="arrow" d="M150 342 L150 377" marker-end="url(#ah)"/>
  <text class="lbl" x="160" y="364">passes</text>

  <rect class="node" x="48" y="480" width="290" height="58" rx="8"/>
  <text class="n1" x="68" y="505">Teacher reviews</text>
  <text class="n2" x="68" y="526">approves and publishes</text>
  <path class="arrow" d="M150 440 L150 475" marker-end="url(#ah)"/>

  <rect class="node-soft" x="48" y="578" width="290" height="58" rx="8"/>
  <text class="n1" x="68" y="603">Learners</text>
  <text class="n2" x="68" y="624">see published content only</text>
  <path class="arrow" d="M150 538 L150 573" marker-end="url(#ah)"/>

  <!-- right: the judge in shadow mode -->
  <rect class="shadow" x="452" y="150" width="300" height="486" rx="12"/>
  <text class="slabel" x="472" y="178">SHADOW MODE</text>
  <rect class="pill" x="472" y="190" width="260" height="24" rx="12"/>
  <text class="pt" x="602" y="206" text-anchor="middle">mode: off · shadow · annotate later</text>

  <rect class="judge" x="472" y="232" width="260" height="132" rx="8"/>
  <text class="n1" x="490" y="258">Content judge</text>
  <rect class="chip" x="490" y="270" width="188" height="22" rx="11"/>
  <text class="ct" x="584" y="285" text-anchor="middle">CHECK 1 · ANSWER KEYS</text>
  <rect class="chip" x="490" y="300" width="224" height="22" rx="11"/>
  <text class="ct" x="602" y="315" text-anchor="middle">CHECK 2 · LESSON OBJECTIVES</text>
  <text class="n2a" x="490" y="346">content read as untrusted data</text>

  <rect class="node" x="472" y="404" width="260" height="58" rx="8"/>
  <text class="n1" x="490" y="429">Findings store</text>
  <text class="n2" x="490" y="450">location, claim, evidence</text>
  <path class="arrow-g" d="M602 364 L602 399" marker-end="url(#ahg)"/>

  <rect class="node" x="472" y="502" width="260" height="76" rx="8"/>
  <text class="n1" x="490" y="527">Admin report</text>
  <text class="n2" x="490" y="548">findings, time and cost</text>
  <text class="n2" x="490" y="566">per lesson vs a $0.005 target</text>
  <path class="arrow-g" d="M602 462 L602 497" marker-end="url(#ahg)"/>

  <text class="lbl" x="472" y="602">judge errors and timeouts are</text>
  <text class="lbl" x="472" y="618">logged; generation carries on</text>

  <!-- copy of each finished unit to the judge -->
  <path class="arrow-g" d="M338 398 L404 398 L404 298 L467 298" marker-end="url(#ahg)"/>
  <text class="lbl" x="352" y="388" fill="#056252">copy</text>

  <!-- blocked path from findings to teacher -->
  <path class="blocked" d="M472 433 L420 433 L420 509 L343 509"/>
  <circle class="xbg" cx="420" cy="471" r="12"/>
  <path class="xmark" d="M415 466 L425 476 M425 466 L415 476"/>
  <text class="bl" x="350" y="531">not shown to</text>
  <text class="bl" x="350" y="547">teachers yet</text>

  <text class="foot" x="48" y="694">Simplified. Annotate mode, which shows findings</text>
  <text class="foot" x="48" y="714">to teachers as warnings, is not built yet.</text>
  <text class="foot" x="752" y="714" text-anchor="end">blog.scenehere.ca</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
