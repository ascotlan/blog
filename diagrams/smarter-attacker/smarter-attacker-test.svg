<svg xmlns="http://www.w3.org/2000/svg" width="800" height="700" viewBox="0 0 800 700" font-family="Inter Variable, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Source for public/images/smarter-attacker/smarter-attacker-test.png (laid out for a ~720px post column). -->
  <style>
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1.1px; fill: #056252; }
    .title { font-size: 21px; font-weight: 600; fill: #17201e; }
    .hdr-weak { fill: #fff4d6; stroke: #e2c27a; stroke-width: 1.2; }
    .hdr-strong { fill: #ddf2ec; stroke: #087f6d; stroke-width: 1.4; }
    .hl-weak { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.8px; fill: #7a4d00; }
    .hl-strong { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 0.8px; fill: #056252; }
    .hsub { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .card { fill: #ffffff; stroke: #b9c6c1; stroke-width: 1.2; }
    .card-weak { fill: #ffffff; stroke: #e7d3a6; stroke-width: 1.2; }
    .n1 { font-size: 16px; font-weight: 600; fill: #17201e; }
    .n2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .note-box { fill: #fbf7ec; stroke: #e2c27a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .note-t { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #7a4d00; }
    .ico-weak { fill: #fff4d6; stroke: #c9a24a; stroke-width: 1.4; }
    .ico-strong { fill: #087f6d; }
    .mark-weak { stroke: #9a6a00; stroke-width: 2; fill: none; stroke-linecap: round; }
    .mark-strong { stroke: #ffffff; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .foot { font-family: 'IBM Plex Mono', monospace; font-size: 13px; fill: #5e6a67; }
  </style>

  <rect width="800" height="700" fill="#ffffff"/>

  <text class="eyebrow" x="48" y="56">THE SMARTER-ATTACKER TEST</text>
  <text class="title" x="48" y="92">Does this defence still work if the attacker is</text>
  <text class="title" x="48" y="120">smarter than your whole team?</text>

  <!-- column headers -->
  <rect class="hdr-weak" x="48" y="152" width="340" height="66" rx="10"/>
  <text class="hl-weak" x="68" y="180">DEPENDS ON ATTACKER LIMITATIONS</text>
  <text class="hsub" x="68" y="202">useful layers, not the last line</text>

  <rect class="hdr-strong" x="412" y="152" width="340" height="66" rx="10"/>
  <text class="hl-strong" x="432" y="180">CHANGES THE CONDITIONS OF ATTACK</text>
  <text class="hsub" x="432" y="202">durable, within stated limits</text>

  <!-- left column: depends on the attacker's limits -->
  <g>
    <rect class="card-weak" x="48" y="234" width="340" height="64" rx="8"/>
    <circle class="ico-weak" cx="76" cy="266" r="11"/><path class="mark-weak" d="M70 266 L82 266"/>
    <text class="n1" x="98" y="261">Obscurity</text>
    <text class="n2" x="98" y="282">"nobody will find it"</text>

    <rect class="card-weak" x="48" y="310" width="340" height="64" rx="8"/>
    <circle class="ico-weak" cx="76" cy="342" r="11"/><path class="mark-weak" d="M70 342 L82 342"/>
    <text class="n1" x="98" y="337">Complexity</text>
    <text class="n2" x="98" y="358">"too hard to exploit"</text>

    <rect class="card-weak" x="48" y="386" width="340" height="64" rx="8"/>
    <circle class="ico-weak" cx="76" cy="418" r="11"/><path class="mark-weak" d="M70 418 L82 418"/>
    <text class="n1" x="98" y="413">Pattern filters</text>
    <text class="n2" x="98" y="434">attackers vary the payload</text>

    <rect class="card-weak" x="48" y="462" width="340" height="64" rx="8"/>
    <circle class="ico-weak" cx="76" cy="494" r="11"/><path class="mark-weak" d="M70 494 L82 494"/>
    <text class="n1" x="98" y="489">Effort</text>
    <text class="n2" x="98" y="510">"not worth anyone's time"</text>

    <rect class="note-box" x="48" y="538" width="340" height="64" rx="8"/>
    <text class="note-t" x="68" y="565">PHP2Shell sat behind complexity</text>
    <text class="note-t" x="68" y="585">until AI-assisted research lowered it.</text>
  </g>

  <!-- right column: holds whoever is attacking -->
  <g>
    <rect class="card" x="412" y="234" width="340" height="64" rx="8"/>
    <circle class="ico-strong" cx="440" cy="266" r="11"/><path class="mark-strong" d="M434.5 266.5 L438.5 270.5 L446 262"/>
    <text class="n1" x="462" y="261">Memory-safe languages</text>
    <text class="n2" x="462" y="282">removes a whole class of bugs</text>

    <rect class="card" x="412" y="310" width="340" height="64" rx="8"/>
    <circle class="ico-strong" cx="440" cy="342" r="11"/><path class="mark-strong" d="M434.5 342.5 L438.5 346.5 L446 338"/>
    <text class="n1" x="462" y="337">Proofs</text>
    <text class="n2" x="462" y="358">hold for what you specify</text>

    <rect class="card" x="412" y="386" width="340" height="64" rx="8"/>
    <circle class="ico-strong" cx="440" cy="418" r="11"/><path class="mark-strong" d="M434.5 418.5 L438.5 422.5 L446 414"/>
    <text class="n1" x="462" y="413">Attack surface reduction</text>
    <text class="n2" x="462" y="434">less code an attacker can reach</text>

    <rect class="card" x="412" y="462" width="340" height="64" rx="8"/>
    <circle class="ico-strong" cx="440" cy="494" r="11"/><path class="mark-strong" d="M434.5 494.5 L438.5 498.5 L446 490"/>
    <text class="n1" x="462" y="489">Isolation and least privilege</text>
    <text class="n2" x="462" y="510">limits what an exploit gains</text>

    <rect class="card" x="412" y="538" width="340" height="64" rx="8"/>
    <circle class="ico-strong" cx="440" cy="570" r="11"/><path class="mark-strong" d="M434.5 570.5 L438.5 574.5 L446 566"/>
    <text class="n1" x="462" y="565">Fast patching</text>
    <text class="n2" x="462" y="586">shortens how long a bug is exposed</text>
  </g>

  <text class="foot" x="48" y="650">Left-column controls still buy time.</text>
  <text class="foot" x="48" y="670">They should not be the last line.</text>
  <text class="foot" x="752" y="670" text-anchor="end">blog.scenehere.ca</text>
</svg>
