<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1128" viewBox="0 0 800 1128" font-family="Inter Variable, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Source for public/images/mcp-audit/mcp-tool-call.png (laid out for a ~720px post column).
       Simplified from the MCP 2026-07-28 specification (architecture overview, tools, Streamable HTTP, MRTR).
       The create_ticket tool is an illustrative example. -->
  <style>
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1.1px; fill: #056252; }
    .title { font-size: 21px; font-weight: 600; fill: #17201e; }
    .head { fill: #ffffff; stroke: #087f6d; stroke-width: 1.6; }
    .n1 { font-size: 16px; font-weight: 600; fill: #17201e; }
    .n2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .life { stroke: #b9c6c1; stroke-width: 1.4; stroke-dasharray: 4 5; }
    .req { stroke: #17201e; stroke-width: 1.6; fill: none; }
    .ret { stroke: #5e6a67; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; }
    .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #17201e; }
    .lblr { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .note { fill: #eef2ef; stroke: #b9c6c1; stroke-width: 1.2; }
    .gate { fill: #ddf2ec; stroke: #087f6d; stroke-width: 1.4; }
    .code { fill: #111b19; }
    .codet { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #e7f5f1; }
    .codek { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #55d6b8; }
    .codem { font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; fill: #8fa29c; }
    .nt { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #17201e; }
    .nta { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: #056252; }
    .alt { fill: none; stroke: #087f6d; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .altl { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; letter-spacing: 0.8px; fill: #056252; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#17201e"/>
    </marker>
    <marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e6a67"/>
    </marker>
  </defs>

  <rect width="800" height="1128" fill="#ffffff"/>

  <text class="eyebrow" x="48" y="56">HOW A TOOL CALL WORKS · MCP 2026-07-28</text>
  <text class="title" x="48" y="92">From tool list to result, one request at a time</text>

  <!-- participants -->
  <rect class="head" x="50" y="124" width="200" height="56" rx="8"/>
  <text class="n1" x="150" y="148" text-anchor="middle">Host + model</text>
  <text class="n2" x="150" y="168" text-anchor="middle">the AI application</text>
  <rect class="head" x="300" y="124" width="200" height="56" rx="8"/>
  <text class="n1" x="400" y="148" text-anchor="middle">MCP client</text>
  <text class="n2" x="400" y="168" text-anchor="middle">inside the host</text>
  <rect class="head" x="550" y="124" width="200" height="56" rx="8"/>
  <text class="n1" x="650" y="148" text-anchor="middle">MCP server</text>
  <text class="n2" x="650" y="168" text-anchor="middle">e.g. ticketing</text>

  <path class="life" d="M150 180 L150 1108"/>
  <path class="life" d="M400 180 L400 1108"/>
  <path class="life" d="M650 180 L650 1108"/>

  <!-- 1 discover -->
  <text class="lbl" x="525" y="218" text-anchor="middle">1 · server/discover (optional)</text>
  <path class="req" d="M400 226 L645 226" marker-end="url(#ah)"/>
  <text class="lblr" x="525" y="254" text-anchor="middle">versions and capabilities</text>
  <path class="ret" d="M650 262 L405 262" marker-end="url(#ahr)"/>

  <!-- 2 tools/list -->
  <text class="lbl" x="525" y="306" text-anchor="middle">2 · tools/list</text>
  <path class="req" d="M400 314 L645 314" marker-end="url(#ah)"/>
  <text class="lblr" x="525" y="342" text-anchor="middle">names, descriptions, schemas</text>
  <path class="ret" d="M650 350 L405 350" marker-end="url(#ahr)"/>

  <!-- 3 definitions to the model -->
  <text class="lbl" x="275" y="394" text-anchor="middle">3 · tool definitions</text>
  <path class="ret" d="M400 402 L155 402" marker-end="url(#ahr)"/>
  <rect class="note" x="34" y="420" width="256" height="74" rx="8"/>
  <text class="nt" x="50" y="442">The model reads the</text>
  <text class="nt" x="50" y="462">descriptions and picks</text>
  <text class="nta" x="50" y="482">create_ticket + args</text>

  <!-- 4 approval is host policy, not an MCP message -->
  <rect class="gate" x="34" y="510" width="256" height="58" rx="8"/>
  <text class="nta" x="50" y="534">4 · host may require approval</text>
  <text class="nt" x="50" y="555">for a risky action</text>

  <!-- 5 tools/call -->
  <text class="lbl" x="275" y="604" text-anchor="middle">call create_ticket</text>
  <path class="req" d="M150 612 L395 612" marker-end="url(#ah)"/>
  <text class="lbl" x="525" y="646" text-anchor="middle">5 · tools/call via HTTP POST</text>
  <path class="req" d="M400 654 L645 654" marker-end="url(#ah)"/>
  <rect class="code" x="414" y="670" width="346" height="124" rx="8"/>
  <text class="codet" x="430" y="694">POST /mcp</text>
  <text class="codem" x="430" y="716">headers a gateway can read:</text>
  <text class="codek" x="430" y="736">Mcp-Method: <tspan class="codet">tools/call</tspan></text>
  <text class="codek" x="430" y="756">Mcp-Name: <tspan class="codet">create_ticket</tspan></text>
  <text class="codem" x="430" y="780">body: arguments (project, summary) + _meta</text>

  <!-- 6 result -->
  <text class="lblr" x="525" y="834" text-anchor="middle">6 · resultType: complete</text>
  <path class="ret" d="M650 842 L405 842" marker-end="url(#ahr)"/>
  <text class="lblr" x="275" y="874" text-anchor="middle">result goes to the model</text>
  <path class="ret" d="M400 882 L155 882" marker-end="url(#ahr)"/>

  <!-- alternative: input required -->
  <rect class="alt" x="34" y="908" width="740" height="196" rx="10"/>
  <text class="altl" x="50" y="932">OR, IF THE SERVER NEEDS INPUT FIRST</text>
  <text class="lblr" x="525" y="962" text-anchor="middle">resultType: input_required</text>
  <path class="ret" d="M650 970 L405 970" marker-end="url(#ahr)"/>
  <text class="lbl" x="275" y="1000" text-anchor="middle">ask the user</text>
  <path class="ret" d="M400 1008 L155 1008" marker-end="url(#ahr)"/>
  <text class="lbl" x="275" y="1038" text-anchor="middle">the user's answer</text>
  <path class="req" d="M150 1046 L395 1046" marker-end="url(#ah)"/>
  <text class="lbl" x="525" y="1076" text-anchor="middle">retry + inputResponses (new id)</text>
  <path class="req" d="M400 1084 L645 1084" marker-end="url(#ah)"/>
</svg>
