<svg xmlns="http://www.w3.org/2000/svg" width="800" height="840" viewBox="0 0 800 840" font-family="Inter Variable, Inter, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!-- Source for public/images/mcp-audit/mcp-architecture.png (laid out for a ~720px post column).
       Server names are generic examples. Based on the MCP architecture overview (protocol version 2026-07-28). -->
  <style>
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1.1px; fill: #056252; }
    .title { font-size: 21px; font-weight: 600; fill: #17201e; }
    .host { fill: #f7f8f6; stroke: #087f6d; stroke-width: 2; }
    .slabel { font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600; letter-spacing: 1px; fill: #056252; }
    .ssub { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .node { fill: #ffffff; stroke: #b9c6c1; stroke-width: 1.2; }
    .server { fill: #ddf2ec; stroke: #087f6d; stroke-width: 1.4; }
    .system { fill: #eef2ef; stroke: #b9c6c1; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .n1 { font-size: 16px; font-weight: 600; fill: #17201e; }
    .n2 { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #5e6a67; }
    .n2a { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; fill: #056252; }
    .arrow { stroke: #5e6a67; stroke-width: 1.6; fill: none; }
    .wire { stroke: #087f6d; stroke-width: 2; fill: none; }
    .chip { fill: #087f6d; }
    .ct { font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; fill: #ffffff; }
    .lbl { font-family: 'IBM Plex Mono', monospace; font-size: 12px; fill: #5e6a67; }
    .lbla { font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600; fill: #056252; }
    .key { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; font-weight: 600; fill: #056252; }
    .legend { fill: #ffffff; stroke: #cfd8d4; stroke-width: 1.2; }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5e6a67"/>
    </marker>
    <marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#087f6d"/>
    </marker>
  </defs>

  <rect width="800" height="840" fill="#ffffff"/>

  <text class="eyebrow" x="48" y="56">WHAT MCP IS</text>
  <text class="title" x="48" y="92">One host, one MCP client per server, many servers</text>

  <!-- host -->
  <rect class="host" x="48" y="124" width="704" height="250" rx="14"/>
  <text class="slabel" x="72" y="154">MCP HOST · THE AI APPLICATION</text>
  <text class="ssub" x="72" y="176">e.g. Claude, ChatGPT, VS Code, or your own agent</text>

  <!-- model -->
  <rect class="node" x="290" y="196" width="220" height="56" rx="8"/>
  <text class="n1" x="400" y="220" text-anchor="middle">Model</text>
  <text class="n2" x="400" y="240" text-anchor="middle">chooses which tool to call</text>

  <!-- clients -->
  <rect class="node" x="72" y="294" width="200" height="56" rx="8"/>
  <text class="n1" x="172" y="318" text-anchor="middle">MCP client A</text>
  <text class="n2" x="172" y="338" text-anchor="middle">talks to server A</text>
  <rect class="node" x="300" y="294" width="200" height="56" rx="8"/>
  <text class="n1" x="400" y="318" text-anchor="middle">MCP client B</text>
  <text class="n2" x="400" y="338" text-anchor="middle">talks to server B</text>
  <rect class="node" x="528" y="294" width="200" height="56" rx="8"/>
  <text class="n1" x="628" y="318" text-anchor="middle">MCP client C</text>
  <text class="n2" x="628" y="338" text-anchor="middle">talks to server C</text>

  <!-- model to clients -->
  <path class="arrow" d="M370 252 L190 289" marker-end="url(#ah)"/>
  <path class="arrow" d="M400 252 L400 289" marker-end="url(#ah)"/>
  <path class="arrow" d="M430 252 L610 289" marker-end="url(#ah)"/>

  <!-- wires: client to server -->
  <path class="wire" d="M172 350 L172 433" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
  <text class="lbla" x="184" y="386">stdio</text>
  <text class="lbl" x="184" y="403">same machine</text>
  <path class="wire" d="M400 350 L400 433" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
  <text class="lbla" x="412" y="386">Streamable HTTP</text>
  <text class="lbl" x="412" y="403">HTTPS</text>
  <text class="lbl" x="412" y="420">OAuth if protected</text>
  <path class="wire" d="M628 350 L628 433" marker-end="url(#ahg)" marker-start="url(#ahg)"/>
  <text class="lbla" x="640" y="386">Streamable HTTP</text>
  <text class="lbl" x="640" y="403">HTTPS</text>
  <text class="lbl" x="640" y="420">OAuth if protected</text>

  <!-- servers -->
  <rect class="server" x="64" y="438" width="216" height="124" rx="8"/>
  <text class="n1" x="80" y="466">Server A · local</text>
  <text class="n2" x="80" y="488">e.g. a filesystem server</text>
  <text class="n2" x="80" y="506">runs as a subprocess</text>
  <rect class="chip" x="80" y="524" width="46" height="22" rx="11"/>
  <text class="ct" x="103" y="539" text-anchor="middle">tools</text>
  <rect class="chip" x="132" y="524" width="74" height="22" rx="11"/>
  <text class="ct" x="169" y="539" text-anchor="middle">resources</text>
  <rect class="chip" x="212" y="524" width="60" height="22" rx="11"/>
  <text class="ct" x="242" y="539" text-anchor="middle">prompts</text>

  <rect class="server" x="292" y="438" width="216" height="124" rx="8"/>
  <text class="n1" x="308" y="466">Server B · remote</text>
  <text class="n2" x="308" y="488">e.g. a ticketing server</text>
  <text class="n2" x="308" y="506">hosted by the vendor</text>
  <rect class="chip" x="308" y="524" width="46" height="22" rx="11"/>
  <text class="ct" x="331" y="539" text-anchor="middle">tools</text>
  <rect class="chip" x="360" y="524" width="74" height="22" rx="11"/>
  <text class="ct" x="397" y="539" text-anchor="middle">resources</text>
  <rect class="chip" x="440" y="524" width="60" height="22" rx="11"/>
  <text class="ct" x="470" y="539" text-anchor="middle">prompts</text>

  <rect class="server" x="520" y="438" width="216" height="124" rx="8"/>
  <text class="n1" x="536" y="466">Server C · remote</text>
  <text class="n2" x="536" y="488">e.g. a CRM server</text>
  <text class="n2" x="536" y="506">run by your IT team</text>
  <rect class="chip" x="536" y="524" width="46" height="22" rx="11"/>
  <text class="ct" x="559" y="539" text-anchor="middle">tools</text>
  <rect class="chip" x="588" y="524" width="74" height="22" rx="11"/>
  <text class="ct" x="625" y="539" text-anchor="middle">resources</text>
  <rect class="chip" x="668" y="524" width="60" height="22" rx="11"/>
  <text class="ct" x="698" y="539" text-anchor="middle">prompts</text>

  <!-- systems -->
  <path class="arrow" d="M172 562 L172 597" marker-end="url(#ah)"/>
  <path class="arrow" d="M400 562 L400 597" marker-end="url(#ah)"/>
  <path class="arrow" d="M628 562 L628 597" marker-end="url(#ah)"/>
  <rect class="system" x="64" y="602" width="216" height="48" rx="8"/>
  <text class="n2" x="172" y="631" text-anchor="middle">files on this machine</text>
  <rect class="system" x="292" y="602" width="216" height="48" rx="8"/>
  <text class="n2" x="400" y="631" text-anchor="middle">the ticketing system's API</text>
  <rect class="system" x="520" y="602" width="216" height="48" rx="8"/>
  <text class="n2" x="628" y="631" text-anchor="middle">the CRM database</text>

  <!-- legend -->
  <rect class="legend" x="48" y="680" width="704" height="132" rx="10"/>
  <text class="key" x="72" y="712">TOOLS</text>
  <text class="n2" x="182" y="712">actions the model can call (create a ticket, run a query)</text>
  <text class="key" x="72" y="738">RESOURCES</text>
  <text class="n2" x="182" y="738">data the application can read (a file, a schema)</text>
  <text class="key" x="72" y="764">PROMPTS</text>
  <text class="n2" x="182" y="764">reusable templates a person can choose to run</text>
  <text class="lbl" x="72" y="794">Every message is JSON-RPC 2.0, whichever transport carries it.</text>
</svg>
